<html><head>

<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="../../styles.css">
<style>
body{margin:0;background:var(--surface-sunken);height:320px;display:flex;align-items:center;justify-content:center;font-family:var(--font-body)}
.scrim{position:absolute;inset:0;background:var(--scrim)}
.dialog{position:relative;width:420px;background:var(--surface-overlay);border-radius:var(--radius-lg);border:1px solid var(--border-subtle);box-shadow:var(--shadow-lg);overflow:hidden}
.head{padding:24px;border-bottom:1px solid var(--border-subtle);font-family:var(--font-display);font-weight:600;font-size:var(--text-lg);color:var(--text-primary)}
.body{padding:24px;color:var(--text-secondary);font-size:var(--text-base);line-height:1.55}
.foot{padding:16px 24px;border-top:1px solid var(--border-subtle);display:flex;justify-content:flex-end;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;height:var(--control-height-md);padding:0 16px;border-radius:var(--radius-sm);border:1px solid transparent;font-family:var(--font-body);font-size:var(--text-base);font-weight:500;cursor:pointer;transition:background var(--duration-fast) var(--ease-standard),color var(--duration-fast) var(--ease-standard)}
.btn:focus-visible{outline:none;box-shadow:var(--focus-ring)}
.ghost{background:transparent;color:var(--text-secondary)}
.ghost:hover{background:var(--surface-hover);color:var(--text-primary)}
.danger{background:var(--danger-500);color:var(--text-on-accent)}
.danger:hover{background:var(--danger-400)}
</style></head>
<body data-theme="dark">
<div class="scrim"></div>
<div class="dialog"><div class="head">Delete project?</div><div class="body">This can't be undone. All associated sessions will be removed.</div><div class="foot"><button class="btn ghost">Cancel</button><button class="btn danger">Delete</button></div></div>
</body></html>
