<html><head>

<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="../../styles.css">
<style>
body{margin:0;background:var(--surface-app);padding:24px;font-family:var(--font-body)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;height:var(--control-height-md);padding:0 16px;font-size:var(--text-base);font-weight:600;border-radius:var(--radius-sm);border:1px solid transparent;font-family:var(--font-body);transition:background var(--duration-fast) var(--ease-standard);cursor:pointer}
.btn.primary{background:linear-gradient(180deg,var(--primary-500) 0%,var(--primary-700) 100%);color:var(--text-on-accent);border-radius:var(--radius-xs);border:1px solid color-mix(in srgb, var(--primary-700) 55%, transparent);box-shadow:inset 0 1px 0 oklch(100% 0 0 / .3),inset 0 -1px 1px oklch(0% 0 0 / .2),0 2px 10px -2px var(--primary-muted-bg),var(--shadow-sm);text-shadow:0 1px 1px oklch(0% 0 0 / .25)}
.btn.primary:hover{background:linear-gradient(180deg,var(--primary-300) 0%,var(--primary-500) 100%)}
.btn.primary:active{transform:translateY(1px);box-shadow:inset 0 1px 2px oklch(0% 0 0 / .3)}
.btn.secondary{background:var(--surface-raised);color:var(--text-primary);border-color:var(--border-strong)}
.btn.secondary:hover{background:var(--surface-hover)}
.btn.ghost{background:transparent;color:var(--text-secondary)}
.btn.ghost:hover{background:var(--surface-hover)}
.btn.danger{background:linear-gradient(180deg,var(--danger-400) 0%,var(--danger-500) 100%);color:var(--text-on-accent);border-radius:var(--radius-xs);border:1px solid color-mix(in srgb, var(--danger-500) 60%, black);box-shadow:inset 0 1px 0 oklch(100% 0 0 / .3),inset 0 -1px 1px oklch(0% 0 0 / .2),0 2px 10px -2px oklch(58% 0.17 25 / 0.25),var(--shadow-sm);text-shadow:0 1px 1px oklch(0% 0 0 / .25)}
.btn.disabled{background:var(--surface-raised);color:var(--text-disabled);cursor:not-allowed}
.btn.sm{height:var(--control-height-sm);font-size:var(--text-sm);padding:0 12px}
</style></head>
<body data-theme="dark">
<div class="row">
<button class="btn primary">Primary</button>
<button class="btn secondary">Secondary</button>
<button class="btn ghost">Ghost</button>
<button class="btn danger">Delete</button>
<button class="btn primary disabled">Disabled</button>
<button class="btn primary sm">Small</button>
</div>
</body></html>
