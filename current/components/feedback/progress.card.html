<html><head>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="../../styles.css">
<style>body{margin:0;background:var(--surface-app);padding:24px;font-family:var(--font-body);display:flex;flex-direction:column;gap:20px}
.row{display:flex;flex-direction:column;gap:4px}.lbl{display:flex;justify-content:space-between;font-size:var(--text-xs);color:var(--text-tertiary)}.pct{font-family:var(--font-mono)}
.track{height:6px;border-radius:var(--radius-full);background:var(--control-track);overflow:hidden}.fill{height:100%;width:64%;border-radius:var(--radius-full);background:var(--primary)}
.spin{width:18px;height:18px;border-radius:50%;border:2px solid var(--border-strong);border-top-color:var(--primary);animation:ds-spin .7s linear infinite}</style></head>
<body data-theme="dark">
<div class="row"><div class="lbl"><span>Rendering</span><span class="pct">64%</span></div><div class="track"><div class="fill"></div></div></div>
<div class="spin"></div>
</body></html>
