<!-- @dsCard group="Components" viewport="700x160" name="Checkbox" -->
<html><head>

<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@600;700&family=Schibsted+Grotesk:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"><link rel="stylesheet" href="../../styles.css">
<style>
body{margin:0;background:var(--surface-app);padding:24px;font-family:var(--font-body);display:flex;gap:24px;align-items:center}
.item{display:flex;align-items:center;gap:10px}
.box{width:16px;height:16px;box-sizing:border-box;border-radius:var(--radius-xs);display:flex;align-items:center;justify-content:center;border:1px solid var(--border-strong);background:var(--control-track)}
.box.on{border-color:var(--primary)}
.inner{width:12px;height:12px;border-radius:3px;background:linear-gradient(180deg,var(--primary-400) 0%,var(--primary-600) 100%);box-shadow:inset 0 1px 0 oklch(100% 0 0 / .3),0 0 4px 0 var(--primary-muted-bg)}
.box.off-disabled{opacity:.5}
.lbl{font-size:var(--text-base);color:var(--text-primary)}
.lbl.disabled{color:var(--text-disabled)}
</style></head>
<body data-theme="dark">
<div class="item"><span class="box on"><span class="inner"></span></span><span class="lbl">Checked</span></div>
<div class="item"><span class="box"></span><span class="lbl">Unchecked</span></div>
<div class="item"><span class="box on"><span class="inner"></span></span><span class="lbl">Indeterminate</span></div>
<div class="item"><span class="box on off-disabled"><span class="inner"></span></span><span class="lbl disabled">Disabled</span></div>
</body></html>
