<!-- @dsCard group="Components" viewport="700x220" name="Select" subtitle="Closed field and open popover" -->
<html><head>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/lucide@0.462.0/dist/umd/lucide.js"></script>
<script>window.addEventListener('DOMContentLoaded',()=>lucide.createIcons({color:'var(--text-tertiary)',strokeWidth:1.75}));</script>

<style>
body{margin:0;background:var(--surface-app);padding:24px;font-family:var(--font-body);display:flex;gap:32px;align-items:flex-start}
.col{width:220px;display:flex;flex-direction:column;gap:6px}
.lbl{font-size:var(--text-sm);color:var(--text-secondary);font-weight:500}
.field{display:flex;align-items:center;justify-content:space-between;height:var(--control-height-md);padding:0 10px 0 12px;border-radius:var(--radius-sm);background:var(--surface-sunken);border:1px solid var(--border-subtle);color:var(--text-primary);font-size:var(--text-base);font-family:var(--font-body);cursor:pointer}
.field:focus-visible{outline:none;box-shadow:var(--focus-ring)}
.field.open{border-color:var(--primary);box-shadow:var(--focus-ring)}
.chev{width:16px;height:16px;flex-shrink:0}
.pop{margin-top:6px;padding:4px;background:var(--surface-overlay);border-radius:var(--radius-md);border:1px solid var(--border-subtle);box-shadow:var(--shadow-md)}
.row{display:flex;align-items:center;justify-content:space-between;padding:7px 10px;border-radius:var(--radius-xs);font-size:var(--text-base);color:var(--text-secondary);background:none;border:none;width:100%;text-align:left;cursor:pointer;font-family:var(--font-body)}
.row:hover{background:var(--surface-hover);color:var(--text-primary)}
.row:focus-visible{outline:none;box-shadow:var(--focus-ring)}
.row.sel{background:var(--primary-muted-bg);color:var(--text-primary)}
.hint{font-family:var(--font-mono);font-size:var(--text-xs);color:var(--text-tertiary)}
</style></head>
<body data-theme="dark">
<div class="col"><span class="lbl" id="lbl-device">Output device</span>
<button class="field" aria-haspopup="listbox" aria-labelledby="lbl-device"><span>Built-in output</span><i data-lucide="chevron-down" class="chev"></i></button></div>
<div class="col"><span class="lbl" id="lbl-rate">Sample rate</span>
<button class="field open" aria-haspopup="listbox" aria-labelledby="lbl-rate" aria-expanded="true"><span>48 kHz</span><i data-lucide="chevron-up" class="chev"></i></button>
<div class="pop" role="listbox" aria-labelledby="lbl-rate"><button class="row" role="option">44.1 kHz</button><button class="row sel" role="option" aria-selected="true"><span>48 kHz</span><span class="hint">default</span></button><button class="row" role="option">96 kHz</button></div></div>
</body></html>
