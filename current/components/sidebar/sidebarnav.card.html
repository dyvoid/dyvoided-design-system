<!-- @dsCard group="Components" viewport="700x340" name="SidebarNav" subtitle="Tabs as a vertical rail" -->
<html><head>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@600;700&family=Schibsted+Grotesk:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"><link rel="stylesheet" href="../../styles.css">
<style>
body{margin:0;background:var(--surface-app);font-family:var(--font-body);display:flex;height:340px}
nav{width:220px;box-sizing:border-box;padding:var(--space-3) var(--space-2);display:flex;flex-direction:column;gap:var(--space-4);background:var(--surface-panel);border-right:1px solid var(--border-subtle)}
.sec{display:flex;flex-direction:column;gap:2px}
.hd{font-family:var(--font-mono);font-size:var(--text-xs);text-transform:uppercase;letter-spacing:0.08em;color:var(--text-tertiary);padding:4px 10px 6px}
.row{position:relative;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--radius-sm);font-size:var(--text-base);font-weight:500;color:var(--text-secondary)}
.row.active{background:var(--surface-active);color:var(--text-primary);font-weight:600}
.row.active::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:2px;border-radius:1px;background:var(--primary)}
.row span.l{flex:1}
.meta{font-family:var(--font-mono);font-size:var(--text-xs);color:var(--text-tertiary)}
.rail{width:56px;box-sizing:border-box;padding:var(--space-3) 0;background:var(--surface-panel);border-right:1px solid var(--border-subtle);display:flex;flex-direction:column;gap:2px;align-items:center}
.ic{width:34px;height:34px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center}
.ic svg{width:18px;height:18px}
.ic.active{background:var(--surface-active)}
</style></head>
<body data-theme="dark">
<nav>
<div class="sec"><span class="hd">Workspace</span>
<div class="row active"><span class="l">Projects</span><span class="meta">12</span></div>
<div class="row"><span class="l">Library</span><span class="meta">84</span></div>
<div class="row"><span class="l">Renders</span></div></div>
<div class="sec"><span class="hd">System</span>
<div class="row"><span class="l">Devices</span></div>
<div class="row"><span class="l">Settings</span></div></div>
</nav>
<div class="rail">
<div class="ic active"><svg viewBox="0 0 24 24" fill="none" stroke="var(--primary-400)" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h18M3 12h18M3 17h10"/></svg></div>
<div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="var(--text-tertiary)" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/></svg></div>
<div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="var(--text-tertiary)" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/></svg></div>
</div>
</body></html>
