<html><head>

<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@600;700&family=Schibsted+Grotesk:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"><link rel="stylesheet" href="../../styles.css">
<style>
body{margin:0;background:var(--surface-app);padding:24px;font-family:var(--font-body);display:flex;gap:24px;align-items:center}
.item{display:flex;align-items:center;gap:10px}
.track{width:30px;height:17px;box-sizing:border-box;border-radius:var(--radius-xs);position:relative;background:var(--control-track);border:1px solid var(--border-strong)}
.track.on{border-color:var(--primary)}
.thumb{position:absolute;top:1px;left:1px;width:13px;height:13px;border-radius:2px;background:var(--gray-500)}
.thumb::after{content:"";position:absolute;left:50%;top:3px;bottom:3px;width:1px;transform:translateX(-50%);background:oklch(0% 0 0 / 0.28)}
.track.on .thumb{left:15px;background:linear-gradient(180deg,var(--primary-400) 0%,var(--primary-600) 100%);box-shadow:inset 0 1px 0 oklch(100% 0 0 / .3),0 0 4px 0 var(--primary-muted-bg)}
.disabled{opacity:.5}
.lbl{font-size:var(--text-base);color:var(--text-primary)}
</style></head>
<body data-theme="dark">
<div class="item"><span class="track on"><span class="thumb"></span></span><span class="lbl">On</span></div>
<div class="item"><span class="track"><span class="thumb"></span></span><span class="lbl">Off</span></div>
<div class="item disabled"><span class="track on"><span class="thumb"></span></span><span class="lbl">Disabled</span></div>
</body></html>
