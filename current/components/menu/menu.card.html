<html><head>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@600;700&family=Schibsted+Grotesk:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"><link rel="stylesheet" href="../../styles.css">
<style>
body{margin:0;background:var(--surface-app);padding:24px;font-family:var(--font-body)}
.menu{width:220px;padding:4px;background:var(--surface-overlay);border-radius:var(--radius-md);border:1px solid var(--border-subtle);box-shadow:var(--shadow-md);display:flex;flex-direction:column;gap:1px}
.hd{font-family:var(--font-mono);font-size:var(--text-xs);text-transform:uppercase;letter-spacing:0.08em;color:var(--text-tertiary);padding:6px 10px 4px}
.it{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:var(--radius-xs);font-size:var(--text-base);color:var(--text-secondary)}
.it.hover{background:var(--surface-hover);color:var(--text-primary)}
.it.dis{color:var(--text-disabled)}
.it.dan{color:var(--danger-400)}
.it span.l{flex:1}
.sc{font-family:var(--font-mono);font-size:var(--text-xs);color:var(--text-tertiary)}
.sep{height:1px;background:var(--border-subtle);margin:4px 6px}
</style></head>
<body data-theme="dark">
<div class="menu">
<span class="hd">Track 3</span>
<div class="it hover"><span class="l">Rename</span><span class="sc">⌘R</span></div>
<div class="it"><span class="l">Duplicate</span><span class="sc">⌘D</span></div>
<div class="it"><span class="l">Freeze</span></div>
<div class="sep"></div>
<div class="it dis"><span class="l">Export stem</span></div>
<div class="it dan"><span class="l">Delete</span><span class="sc">⌫</span></div>
</div>
</body></html>
