<html><head>

<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@600;700&family=Schibsted+Grotesk:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"><link rel="stylesheet" href="../../styles.css">
<style>
body{margin:0;background:var(--surface-app);padding:24px;font-family:var(--font-body)}
.field{max-width:420px;margin-bottom:24px}
.top{display:flex;justify-content:space-between;margin-bottom:8px}
.label{font-size:var(--text-sm);color:var(--text-secondary);font-weight:600}
.val{font-size:var(--text-sm);font-family:var(--font-mono);color:var(--text-tertiary)}
.track{height:4px;border-radius:2px;background:var(--control-track);position:relative}
.fill{height:4px;border-radius:2px;position:absolute;left:0;top:0}
.knob{position:absolute;top:-5px;width:14px;height:14px;box-sizing:border-box;border-radius:50%;background:linear-gradient(180deg,oklch(100% 0 0),oklch(95.5% 0.002 260));box-shadow:inset 0 1px 1px oklch(100% 0 0 / .8),0 0 0 4px var(--primary-muted-bg),var(--shadow-md);border:3px solid var(--primary)}
.ticks{display:flex;justify-content:space-between;margin-top:4px;padding:0 1px}
.ticks span{width:1px;height:5px;background:var(--gray-500);opacity:.85}
</style></head>
<body data-theme="dark">
<div class="field"><div class="top"><span class="label">Resonance</span><span class="val">62%</span></div>
<div class="track"><div class="fill" style="width:62%;background:var(--primary)"></div><div class="knob" style="left:calc(62% - 7px);border-color:var(--primary);box-shadow:inset 0 1px 1px oklch(100% 0 0 / .8),0 0 0 4px var(--primary-muted-bg),var(--shadow-md)"></div></div>
<div class="ticks"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div></div>
<div class="field"><div class="top"><span class="label">Drive</span><span class="val">30%</span></div>
<div class="track"><div class="fill" style="width:30%;background:var(--accent-1-500)"></div><div class="knob" style="left:calc(30% - 7px);border-color:var(--accent-1-500);box-shadow:inset 0 1px 1px oklch(100% 0 0 / .8),0 0 0 4px var(--accent-1-muted-bg),var(--shadow-md)"></div></div>
<div class="ticks"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div></div>
</body></html>
