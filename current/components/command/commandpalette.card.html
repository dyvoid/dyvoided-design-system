<!-- @dsCard group="Components" viewport="700x420" name="Command palette" subtitle="⌘K search over commands and files" -->
<html><head>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/lucide@0.462.0/dist/umd/lucide.js"></script>
<script>window.addEventListener('DOMContentLoaded',()=>lucide.createIcons({color:'var(--text-tertiary)',strokeWidth:1.75}));</script>

<style>
body{margin:0;background:var(--surface-app);font-family:var(--font-body);height:420px;display:flex;justify-content:center;align-items:flex-start;padding-top:40px}
.pal{width:560px;background:var(--surface-overlay);border-radius:var(--radius-lg);border:1px solid var(--border-strong);box-shadow:var(--shadow-lg);overflow:hidden}
.q{display:flex;align-items:center;gap:10px;padding:0 14px;height:48px;border-bottom:1px solid var(--border-subtle)}
.q svg{width:16px;height:16px;flex-shrink:0}
.q .txt{flex:1;color:var(--text-primary);font-size:var(--text-md);background:none;border:none;outline:none;font-family:var(--font-body)}
.esc{font-family:var(--font-mono);font-size:var(--text-xs);color:var(--text-tertiary);border:1px solid var(--border-subtle);border-radius:var(--radius-xs);padding:2px 6px}
.list{padding:6px}
.grp{display:flex;flex-direction:column;gap:1px;margin-bottom:4px}
.hd{font-family:var(--font-mono);font-size:var(--text-xs);text-transform:uppercase;letter-spacing:var(--tracking-wide);color:var(--text-tertiary);padding:8px 10px 5px}
.it{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--radius-sm);font-size:var(--text-base);color:var(--text-secondary);background:none;border:none;width:100%;text-align:left;cursor:pointer;font-family:var(--font-body)}
.it:hover{background:var(--surface-hover);color:var(--text-primary)}
.it:focus-visible{outline:none;box-shadow:var(--focus-ring)}
.it.active{background:var(--primary-muted-bg);color:var(--text-primary)}
.it span.l{flex:1}
.sc{font-family:var(--font-mono);font-size:var(--text-xs);color:var(--text-tertiary)}
.hint{font-size:var(--text-xs);color:var(--text-tertiary)}
.ft{padding:8px 14px;border-top:1px solid var(--border-subtle);display:flex;gap:14px;font-family:var(--font-mono);font-size:var(--text-xs);color:var(--text-tertiary)}
</style></head>
<body data-theme="dark">
<div class="pal" role="dialog" aria-label="Command palette">
<div class="q"><i data-lucide="search"></i><input class="txt" value="ren" placeholder="Search commands" aria-label="Search commands"><span class="esc">ESC</span></div>
<div class="list" role="listbox">
<div class="grp"><span class="hd">Commands</span>
<button class="it active" role="option" aria-selected="true"><span class="l">Render project</span><span class="sc">⌘⏎</span></button>
<button class="it" role="option"><span class="l">Rename layer</span><span class="sc">⌘R</span></button>
<button class="it" role="option"><span class="l">Re-scan devices</span></button></div>
<div class="grp"><span class="hd">Files</span>
<button class="it" role="option"><span class="l">render-notes.md</span><span class="hint">docs/</span></button>
<button class="it" role="option"><span class="l">renderer.ts</span><span class="hint">src/core/</span></button></div>
</div>
<div class="ft"><span>↑↓ navigate</span><span>⏎ run</span><span>⌘K toggle</span></div>
</div>
</body></html>
