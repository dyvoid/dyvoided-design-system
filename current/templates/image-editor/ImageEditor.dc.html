<div style="flex:1;overflow:auto;padding:var(--space-5)">

<sc-if value="{{ layer0Active }}" hint-placeholder-val="{{ true }}"><div onClick="{{ selectLayer0 }}" style="display:flex;align-items:center;gap:10px;padding:var(--space-2);border-radius:var(--radius-sm);cursor:pointer;background:var(--primary-muted-bg)"><span style="width:34px;height:26px;border-radius:var(--radius-xs);flex-shrink:0;border:1px solid var(--border-subtle);background:linear-gradient(150deg,var(--primary-500),var(--accent-3-500))"></span><span style="font-size:var(--text-sm);color:var(--text-primary);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Gradient wash</span><span style="font-family:var(--font-mono);font-size:10px;color:var(--text-tertiary)">100</span></div></sc-if>

<sc-if value="{{ layer1Active }}" hint-placeholder-val="{{ false }}"><div onClick="{{ selectLayer1 }}" style="display:flex;align-items:center;gap:10px;padding:var(--space-2);border-radius:var(--radius-sm);cursor:pointer;background:var(--primary-muted-bg)"><span style="width:34px;height:26px;border-radius:var(--radius-xs);flex-shrink:0;border:1px solid var(--border-subtle);background:linear-gradient(150deg,var(--accent-1-500),var(--accent-2-500))"></span><span style="font-size:var(--text-sm);color:var(--text-primary);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Type — "ECHO"</span><span style="font-family:var(--font-mono);font-size:10px;color:var(--text-tertiary)">92</span></div></sc-if>

<sc-if value="{{ !layer2Active }}" hint-placeholder-val="{{ true }}"><div onClick="{{ selectLayer2 }}" style="display:flex;align-items:center;gap:10px;padding:var(--space-2);border-radius:var(--radius-sm);cursor:pointer;background:transparent"><span style="width:34px;height:26px;border-radius:var(--radius-xs);flex-shrink:0;border:1px solid var(--border-subtle);background:var(--surface-sunken)"></span><span style="font-size:var(--text-sm);color:var(--text-tertiary);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Grain overlay</span><span style="font-family:var(--font-mono);font-size:10px;color:var(--text-tertiary)">40</span></div></sc-if>

<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { activeTool: 'move', rightTab: 'adjust', exposure: 62, contrast: 64, highlights: 41, temperature: 55, saturation: 65, selectedLayer: 0 };
  renderVals() {
    const tools = ['move', 'marquee', 'lasso', 'crop', 'brush', 'eyedrop'];
    const toolVals = {};
    tools.forEach(id => {
      const cap = id[0].toUpperCase() + id.slice(1);
      toolVals['select' + cap] = () => this.setState({ activeTool: id });
      toolVals[id + 'Active'] = id === this.state.activeTool;
    });
    const layerVals = {};
    for (let i = 0; i < 4; i++) {
      layerVals['selectLayer' + i] = () => this.setState({ selectedLayer: i });
      layerVals['layer' + i + 'Active'] = i === this.state.selectedLayer;
    }
    return {
      ...toolVals, ...layerVals, activeTool: this.state.activeTool,
      rightTab: this.state.rightTab, setRightTab: (id) => this.setState({ rightTab: id }),
      rightTabs: [{ id: 'adjust', label: 'Adjust' }, { id: 'layers', label: 'Layers' }, { id: 'history', label: 'History' }],
      exposure: this.state.exposure, setExposure: (v) => this.setState({ exposure: v }), exposureLabel: ((this.state.exposure - 50) / 100).toFixed(2),
      contrast: this.state.contrast, setContrast: (v) => this.setState({ contrast: v }), contrastLabel: Math.round((this.state.contrast - 50) * 0.8),
      highlights: this.state.highlights, setHighlights: (v) => this.setState({ highlights: v }), highlightsLabel: Math.round((this.state.highlights - 50) * 0.8),
      temperature: this.state.temperature, setTemperature: (v) => this.setState({ temperature: v }), temperatureLabel: Math.round((this.state.temperature - 50) * 0.4),
      saturation: this.state.saturation, setSaturation: (v) => this.setState({ saturation: v }), saturationLabel: Math.round((this.state.saturation - 50) * 0.8),
    };
  }
}
</script>
