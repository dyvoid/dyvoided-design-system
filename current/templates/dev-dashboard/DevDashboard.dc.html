<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="Dev Dashboard Shell" description="Sidebar + top bar admin/dev-tooling shell with stat cards, service list, deployments DataTable, and a progress-tracked deploy dialog" -->
<helmet><script src="./ds-base.js"></script></helmet>
<div style="width:1280px;height:800px" data-theme="{{ theme }}">
<x-import component-from-global-scope="DyvoidedDesignSystem_7b704c.WindowChrome" title="Console" platform="mac" hint-size="1280px,800px">
<div style="display:flex;height:100%;font-family:var(--font-body)" data-density="{{ density }}">
<div style="width:200px;border-right:1px solid var(--border-subtle);display:flex;flex-direction:column;background:linear-gradient(165deg,var(--surface-raised) 0%,var(--surface-panel) 55%,var(--accent-2-muted-bg) 160%)">
<div style="flex:1;min-height:0">
<x-import component-from-global-scope="DyvoidedDesignSystem_7b704c.SidebarNav" sections="{{ sidebarSections }}" activeId="{{ activeNav }}" onChange="{{ setActiveNav }}" width="{{ 200 }}" hint-size="200px,100%"></x-import>
</div>
<div style="padding:var(--space-5);border-top:1px solid var(--border-subtle);display:flex;flex-direction:column;gap:var(--space-4)">
<div style="display:flex;align-items:center;gap:10px">
<x-import component-from-global-scope="DyvoidedDesignSystem_7b704c.Avatar" name="{{ operatorName }}" size="sm" status="online" hint-size="32px,32px"></x-import>
<span style="font-size:var(--text-sm);color:var(--text-secondary);font-weight:600">{{ operatorName }}</span>
</div>
<div>
<div style="font-family:var(--font-mono);font-size:var(--font-size-xs);letter-spacing:var(--tracking-wide);color:var(--text-secondary);text-transform:uppercase;margin-bottom:var(--space-3)">System status</div>
<x-import component-from-global-scope="DyvoidedDesignSystem_7b704c.Badge" variant="{{ overallVariant }}" hint-size="100px,24px">{{ overallLabel }}</x-import>
</div>
</div>
</div>
<div style="flex:1;padding:var(--space-7);overflow:auto;position:relative;background-image:radial-gradient(circle at 10% -10%, var(--primary-muted-bg) 0%, transparent 45%),radial-gradient(circle at 95% 10%, var(--accent-3-muted-bg) 0%, transparent 40%),radial-gradient(circle at 60% 100%, var(--accent-2-muted-bg) 0%, transparent 35%),radial-gradient(var(--dot-grid) 1px, transparent 1px);background-size:100% 100%,100% 100%,100% 100%,22px 22px;background-position:0 0,0 0,0 0,-4px -4px">
<div style="display:flex;align-items:center;justify-content:space-between;gap:var(--space-5);margin-bottom:var(--space-6)">
<div style="width:300px">
<x-import component-from-global-scope="DyvoidedDesignSystem_7b704c.Input" placeholder="Search services, logs, deploys" value="{{ search }}" onChange="{{ setSearch }}" hint-size="300px,44px"></x-import>
</div>
<div style="display:flex;align-items:center;gap:14px">
<x-import component-from-global-scope="DyvoidedDesignSystem_7b704c.Tabs" items="{{ envTabs }}" activeId="{{ envTab }}" onChange="{{ setEnvTab }}" hint-size="160px,32px"></x-import>
<x-import component-from-global-scope="DyvoidedDesignSystem_7b704c.Button" variant="ghost" onClick="{{ openCmd }}" hint-size="90px,36px">⌘K search</x-import>
<x-import component-from-global-scope="DyvoidedDesignSystem_7b704c.Button" variant="primary" onClick="{{ openDialog }}" hint-size="150px,36px">New deployment</x-import>
</div>
</div>
<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:var(--space-5);margin-bottom:var(--space-6)">
<sc-for list="{{ metrics }}" as="m" hint-placeholder-count="4">
<x-import component-from-global-scope="DyvoidedDesignSystem_7b704c.Panel" padding="sm" hint-size="100%,90px">
<div style="font-family:var(--font-mono);font-size:var(--font-size-xs);letter-spacing:var(--tracking-wide);color:var(--text-secondary);text-transform:uppercase;margin-bottom:6px">{{ m.label }}</div>
<div style="font-family:var(--font-display);font-weight:700;font-size:var(--text-2xl);color:var(--text-primary);letter-spacing:var(--tracking-tight)">{{ m.value }}</div>
</x-import>
</sc-for>
</div>
<div style="position:relative;border-radius:var(--radius-lg);overflow:hidden;margin-bottom:var(--space-6)">
<div style="position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--signature-500) 0%,transparent 75%);z-index:1"></div>
<x-import component-from-global-scope="DyvoidedDesignSystem_7b704c.Panel" title="Services" hint-size="100%,320px">
<div style="margin-bottom:var(--space-5)">
<x-import component-from-global-scope="DyvoidedDesignSystem_7b704c.Tabs" items="{{ serviceTabs }}" activeId="{{ serviceTab }}" onChange="{{ setServiceTab }}" hint-size="240px,32px"></x-import>
</div>
<sc-if value="{{ noServices }}" hint-placeholder-val="{{ false }}">
<x-import component-from-global-scope="DyvoidedDesignSystem_7b704c.EmptyState" title="No services match" description="Nothing in this environment matches the current filter." hint-size="100%,180px"></x-import>
</sc-if>
<div style="display:flex;flex-direction:column;gap:2px">
<sc-for list="{{ services }}" as="svc" hint-placeholder-count="4">
<div style="display:flex;align-items:center;justify-content:space-between;padding:var(--space-3)">
<div style="display:flex;align-items:center;gap:12px">
<x-import component-from-global-scope="DyvoidedDesignSystem_7b704c.Badge" variant="{{ svc.status }}" hint-size="80px,22px">{{ svc.statusLabel }}</x-import>
<span style="font-family:var(--font-mono);font-size:var(--text-sm);color:var(--text-primary)">{{ svc.name }}</span>
</div>
<div style="display:flex;align-items:center;gap:16px;position:relative">
<x-import component-from-global-scope="DyvoidedDesignSystem_7b704c.Switch" checked="{{ svc.enabled }}" onChange="{{ svc.toggleEnabled }}" hint-size="40px,20px"></x-import>
<x-import component-from-global-scope="DyvoidedDesignSystem_7b704c.Button" variant="ghost" size="sm" onClick="{{ svc.toggleMenu }}" hint-size="28px,28px">⋯</x-import>
<sc-if value="{{ svc.menuOpen }}" hint-placeholder-val="{{ false }}">
<div style="position:absolute;top:32px;right:0;z-index:50">
<x-import component-from-global-scope="DyvoidedDesignSystem_7b704c.Menu" items="{{ svc.menuItems }}" onSelect="{{ svc.onMenuSelect }}" width="{{ 180 }}" hint-size="180px,120px"></x-import>
</div>
</sc-if>
</div>
</div>
</sc-for>
</div>
</x-import>
</div>
<div style="position:relative;border-radius:var(--radius-lg);overflow:hidden;margin-bottom:var(--space-6)">
<div style="position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--signature-500) 0%,transparent 75%);z-index:1"></div>
<x-import component-from-global-scope="DyvoidedDesignSystem_7b704c.Panel" title="Recent deployments" hint-size="100%,240px">
<x-import component-from-global-scope="DyvoidedDesignSystem_7b704c.DataTable" columns="{{ deployColumns }}" rows="{{ deployRows }}" rowKey="id" hint-size="100%,180px"></x-import>
</x-import>
</div>
<div style="position:relative;border-radius:var(--radius-lg);overflow:hidden">
<div style="position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--signature-500) 0%,transparent 75%);z-index:1"></div>
<x-import component-from-global-scope="DyvoidedDesignSystem_7b704c.Panel" title="Activity" padding="sm" hint-size="100%,150px">
<div style="display:flex;flex-direction:column;gap:2px">
<sc-for list="{{ logLines }}" as="line" hint-placeholder-count="4">
<div style="font-family:var(--font-mono);font-size:var(--font-size-xs);color:var(--text-secondary);padding:var(--space-2) var(--space-3);border-bottom:1px solid var(--border-subtle)">{{ line }}</div>
</sc-for>
</div>
</x-import>
</div>
</div>
</div>
</x-import>
</div>
<x-import component-from-global-scope="DyvoidedDesignSystem_7b704c.Dialog" open="{{ dialogOpen }}" title="Confirm deployment" onClose="{{ closeDialog }}" hint-size="420px,220px">
<div style="display:flex;flex-direction:column;gap:var(--space-4)">
<div>Deploy the latest build to the {{ envLabelLower }} environment. This restarts all affected services.</div>
<x-import component-from-global-scope="DyvoidedDesignSystem_7b704c.Select" label="Target environment" options="{{ envOptions }}" value="{{ envTab }}" onChange="{{ setEnvTab }}" hint-size="100%,60px"></x-import>
<sc-if value="{{ deploying }}" hint-placeholder-val="{{ false }}">
<x-import component-from-global-scope="DyvoidedDesignSystem_7b704c.ProgressBar" value="{{ deployPct }}" label="Rolling out build" hint-size="100%,28px"></x-import>
</sc-if>
<div style="display:flex;justify-content:flex-end;align-items:center;gap:12px;padding-top:var(--space-3);border-top:1px solid var(--border-subtle)">
<sc-if value="{{ deploying }}" hint-placeholder-val="{{ false }}"><x-import component-from-global-scope="DyvoidedDesignSystem_7b704c.Spinner" hint-size="18px,18px"></x-import></sc-if>
<x-import component-from-global-scope="DyvoidedDesignSystem_7b704c.Button" variant="ghost" onClick="{{ closeDialog }}" hint-size="80px,36px">Cancel</x-import>
<x-import component-from-global-scope="DyvoidedDesignSystem_7b704c.Button" variant="primary" onClick="{{ deployNow }}" hint-size="80px,36px">Deploy</x-import>
</div>
</div>
</x-import>
<x-import component-from-global-scope="DyvoidedDesignSystem_7b704c.CommandPalette" open="{{ cmdOpen }}" query="{{ cmdQuery }}" onQueryChange="{{ setCmdQuery }}" groups="{{ cmdGroups }}" onSelect="{{ onCmdSelect }}" onClose="{{ closeCmd }}" hint-size="560px,300px"></x-import>
<sc-if value="{{ toastMsg }}" hint-placeholder-val="{{ false }}">
<x-import component-from-global-scope="DyvoidedDesignSystem_7b704c.ToastStack" placement="bottom-right" hint-size="340px,80px">
<x-import component-from-global-scope="DyvoidedDesignSystem_7b704c.Toast" variant="success" title="{{ toastMsg }}" onClose="{{ closeToast }}" hint-size="340px,60px"></x-import>
</x-import>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = {
    theme: 'dark', density: false, activeNav: 'services', envTab: 'prod', search: '',
    serviceTab: 'all', dialogOpen: false, menuOpenFor: null,
    cmdOpen: false, cmdQuery: '', toastMsg: null, deploying: false, deployPct: 0,
    services: [
      { name: 'api-gateway', status: 'success', statusLabel: 'Healthy', enabled: true },
      { name: 'auth-service', status: 'success', statusLabel: 'Healthy', enabled: true },
      { name: 'billing-worker', status: 'warning', statusLabel: 'Degraded', enabled: true },
      { name: 'notifications', status: 'danger', statusLabel: 'Down', enabled: false },
      { name: 'search-index', status: 'success', statusLabel: 'Healthy', enabled: true }
    ]
  };
  NAV = [
    { id: 'overview', label: 'Overview' },
    { id: 'services', label: 'Services' },
    { id: 'deployments', label: 'Deployments' },
    { id: 'logs', label: 'Logs' },
    { id: 'settings', label: 'Settings' }
  ];
  METRICS = [
    { label: 'Requests/min', value: '12.4k' },
    { label: 'Error rate', value: '0.42%' },
    { label: 'Latency p95', value: '184ms' },
    { label: 'Uptime', value: '99.98%' }
  ];
  DEPLOYS = [
    { id: 'd1', service: 'api-gateway', version: 'v2.3.1', env: 'Production', duration: '2m 14s', when: '14:02' },
    { id: 'd2', service: 'auth-service', version: 'v1.9.0', env: 'Production', duration: '1m 48s', when: '13:55' },
    { id: 'd3', service: 'billing-worker', version: 'v0.8.4', env: 'Staging', duration: '3m 02s', when: '13:31' },
    { id: 'd4', service: 'search-index', version: 'v4.1.0', env: 'Staging', duration: '5m 27s', when: '12:58' },
  ];
  componentWillUnmount() { clearInterval(this._dt); }
  LOG_LINES = [
    '14:02:11 deploy api-gateway v2.3.1 succeeded',
    '14:00:47 scale billing-worker to 3 replicas',
    '13:58:02 alert notifications: 5xx spike',
    '13:55:19 deploy auth-service v1.9.0 succeeded'
  ];

  renderVals() {
    const s = this.state;
    const filtered = s.services.filter(svc => {
      if (s.serviceTab === 'healthy') return svc.status === 'success';
      if (s.serviceTab === 'degraded') return svc.status !== 'success';
      return true;
    });
    const anyDown = s.services.some(svc => svc.status === 'danger');
    const anyDegraded = s.services.some(svc => svc.status === 'warning');
    return {
      theme: s.theme === 'light' ? 'light' : undefined,
      density: s.density ? 'compact' : undefined,
      navItems: this.NAV.map(n => ({
        label: n.label,
        active: n.id === s.activeNav,
        inactive: n.id !== s.activeNav,
        select: () => this.setState({ activeNav: n.id })
      })),
      activeNav: s.activeNav,
      setActiveNav: (id) => this.setState({ activeNav: id }),
      sidebarSections: [
        { label: 'Monitor', items: [
          { id: 'overview', label: 'Overview' },
          { id: 'services', label: 'Services', meta: anyDown ? '!' : undefined },
          { id: 'logs', label: 'Logs' }
        ] },
        { label: 'Manage', items: [
          { id: 'deployments', label: 'Deployments' },
          { id: 'settings', label: 'Settings' }
        ] }
      ],
      operatorName: 'Dana Reyes',
      envOptions: [{ value: 'prod', label: 'Production' }, { value: 'staging', label: 'Staging' }],
      cmdOpen: s.cmdOpen,
      openCmd: () => this.setState({ cmdOpen: true, cmdQuery: '' }),
      closeCmd: () => this.setState({ cmdOpen: false }),
      cmdQuery: s.cmdQuery,
      setCmdQuery: (v) => this.setState({ cmdQuery: v }),
      cmdGroups: [
        { label: 'Navigate', items: this.NAV.filter(n => n.label.toLowerCase().includes(s.cmdQuery.toLowerCase())).map(n => ({ id: 'nav-' + n.id, label: n.label })) },
        { label: 'Services', items: s.services.filter(svc => svc.name.toLowerCase().includes(s.cmdQuery.toLowerCase())).map(svc => ({ id: 'restart-' + svc.name, label: 'Restart ' + svc.name })) }
      ],
      onCmdSelect: (id) => {
        if (id.startsWith('nav-')) this.setState({ activeNav: id.slice(4), cmdOpen: false });
        else if (id.startsWith('restart-')) {
          const name = id.slice(8);
          this.setState(st => ({ cmdOpen: false, services: st.services.map(x => x.name === name ? { ...x, status: 'success', statusLabel: 'Healthy' } : x) }));
        }
      },
      toastMsg: s.toastMsg,
      closeToast: () => this.setState({ toastMsg: null }),
      deploying: s.deploying, deployPct: s.deployPct,
      deployColumns: [
        { key: 'service', label: 'Service' },
        { key: 'version', label: 'Version', numeric: true },
        { key: 'env', label: 'Environment' },
        { key: 'duration', label: 'Duration', numeric: true, align: 'right' },
        { key: 'when', label: 'Finished', align: 'right' },
      ],
      deployRows: this.DEPLOYS,
      noServices: filtered.length === 0,
      deployNow: () => {
        if (s.deploying) return;
        clearInterval(this._dt);
        this.setState({ deploying: true, deployPct: 0, toastMsg: null });
        this._dt = setInterval(() => {
          const next = this.state.deployPct + 10;
          if (next >= 100) {
            clearInterval(this._dt);
            this.setState({ deploying: false, deployPct: 100, dialogOpen: false, toastMsg: 'Deployed to ' + (this.state.envTab === 'prod' ? 'production' : 'staging') });
          } else this.setState({ deployPct: next });
        }, 110);
      },
      overallVariant: anyDown ? 'danger' : (anyDegraded ? 'warning' : 'success'),
      overallLabel: anyDown ? 'Incident' : (anyDegraded ? 'Degraded' : 'All systems go'),
      envTabs: [{ id: 'prod', label: 'Production' }, { id: 'staging', label: 'Staging' }],
      envTab: s.envTab,
      setEnvTab: (id) => this.setState({ envTab: id }),
      envLabelLower: s.envTab === 'prod' ? 'production' : 'staging',
      search: s.search,
      setSearch: (v) => this.setState({ search: v }),
      metrics: this.METRICS,
      serviceTabs: [{ id: 'all', label: 'All' }, { id: 'healthy', label: 'Healthy' }, { id: 'degraded', label: 'Degraded' }],
      serviceTab: s.serviceTab,
      setServiceTab: (id) => this.setState({ serviceTab: id }),
      services: filtered.map(svc => ({
        name: svc.name, status: svc.status, statusLabel: svc.statusLabel, enabled: svc.enabled,
        toggleEnabled: () => this.setState(st => ({
          services: st.services.map(x => x.name === svc.name ? { ...x, enabled: !x.enabled } : x)
        })),
        menuOpen: s.menuOpenFor === svc.name,
        toggleMenu: () => this.setState(st => ({ menuOpenFor: st.menuOpenFor === svc.name ? null : svc.name })),
        menuItems: [
          { id: 'logs', label: 'View logs' },
          { id: 'restart', label: 'Restart' },
          { id: svc.enabled ? 'disable' : 'enable', label: svc.enabled ? 'Disable' : 'Enable', danger: svc.enabled },
        ],
        onMenuSelect: (id) => this.setState(st => ({
          menuOpenFor: null,
          services: st.services.map(x => {
            if (x.name !== svc.name) return x;
            if (id === 'restart') return { ...x, status: 'success', statusLabel: 'Healthy' };
            if (id === 'disable' || id === 'enable') return { ...x, enabled: id === 'enable' };
            return x;
          })
        }))
      })),
      logLines: this.LOG_LINES,
      dialogOpen: s.dialogOpen,
      openDialog: () => this.setState({ dialogOpen: true }),
      closeDialog: () => this.setState({ dialogOpen: false })
    };
  }
}
</script>
</body>
</html>
