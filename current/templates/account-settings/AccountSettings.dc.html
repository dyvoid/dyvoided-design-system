<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="Account Settings Shell" description="Sidebar-nav settings page exercising Input, Tabs, Switch, Checkbox, and danger Button together" -->
<helmet><script src="./ds-base.js"></script></helmet>
<div style="width:1280px;height:800px" data-theme="dark">
<x-import component-from-global-scope="DyvoidedDesignSystem_7b704c.WindowChrome" title="dyvoided.2" platform="mac" hint-size="1280px,800px">
<div style="display:flex;height:100%;font-family:var(--font-body)">
<div style="width:220px;flex-shrink:0;border-right:1px solid var(--border-subtle);background:linear-gradient(165deg,var(--surface-raised) 0%,var(--surface-panel) 55%,var(--primary-muted-bg) 160%)">
<x-import component-from-global-scope="DyvoidedDesignSystem_7b704c.SidebarNav" sections="{{ sidebarSections }}" activeId="{{ activeNav }}" onChange="{{ setActiveNav }}" width="{{ 220 }}" hint-size="220px,100%"></x-import>
</div>
<div style="flex:1;padding:var(--space-7);overflow:auto;position:relative;background-image:radial-gradient(circle at 10% -10%, var(--primary-muted-bg) 0%, transparent 45%),radial-gradient(circle at 95% 10%, var(--accent-3-muted-bg) 0%, transparent 40%),radial-gradient(circle at 60% 100%, var(--accent-2-muted-bg) 0%, transparent 35%),radial-gradient(var(--border-subtle) 1px, transparent 1px);background-size:100% 100%,100% 100%,100% 100%,22px 22px;background-position:0 0,0 0,0 0,-4px -4px">
<div style="margin-bottom:var(--space-6)" data-screen-label="account-settings">
<div style="font-family:var(--font-mono);font-size:var(--font-size-xs);letter-spacing:0.26em;text-transform:uppercase;color:var(--signature-500);margin-bottom:8px">Settings / Account</div>
<div style="font-family:var(--font-display);font-weight:700;font-size:var(--text-3xl);color:var(--text-primary);letter-spacing:var(--tracking-tight)">Profile</div>
<div style="font-size:var(--text-sm);color:var(--text-secondary);margin-top:6px">Manage your account details and preferences.</div>
</div>
<div style="margin-bottom:var(--space-6)">
<x-import component-from-global-scope="DyvoidedDesignSystem_7b704c.Panel" hint-size="100%,220px">
<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--space-6)">
<x-import component-from-global-scope="DyvoidedDesignSystem_7b704c.Tabs" items="{{ infoTabs }}" activeId="{{ infoTab }}" onChange="{{ setInfoTab }}" hint-size="160px,32px"></x-import>
</div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:var(--space-5);margin-bottom:var(--space-6)">
<x-import component-from-global-scope="DyvoidedDesignSystem_7b704c.Input" label="Full name" value="{{ fullName }}" onChange="{{ setFullName }}" hint-size="100%,56px"></x-import>
<x-import component-from-global-scope="DyvoidedDesignSystem_7b704c.Input" label="Email" value="{{ email }}" onChange="{{ setEmail }}" hint-size="100%,56px"></x-import>
</div>
<div style="display:flex;justify-content:flex-end;gap:10px;align-items:center;border-top:1px solid var(--border-subtle);padding-top:var(--space-4)">
<span style="font-family:var(--font-mono);font-size:var(--font-size-xs);letter-spacing:0.12em;color:var(--text-secondary);margin-right:auto;text-transform:uppercase">Last saved 14:22</span>
<x-import component-from-global-scope="DyvoidedDesignSystem_7b704c.Button" variant="ghost" hint-size="80px,36px">Cancel</x-import>
<x-import component-from-global-scope="DyvoidedDesignSystem_7b704c.Button" variant="primary" hint-size="130px,36px">Save changes</x-import>
</div>
</x-import>
</div>
<div style="margin-bottom:var(--space-6)">
<x-import component-from-global-scope="DyvoidedDesignSystem_7b704c.Panel" title="Notification preferences" hint-size="100%,260px">
<div style="display:flex;flex-direction:column;gap:0">
<div style="display:flex;align-items:center;justify-content:space-between;padding:var(--space-3) 0;border-bottom:1px solid var(--border-subtle)"><div><div style="font-size:var(--text-base);color:var(--text-primary);font-weight:600">Email notifications</div><div style="font-size:var(--text-xs);color:var(--text-secondary);margin-top:2px">Weekly summaries and important updates</div></div><x-import component-from-global-scope="DyvoidedDesignSystem_7b704c.Switch" checked="{{ emailNotif }}" onChange="{{ setEmailNotif }}" hint-size="30px,17px"></x-import></div>
<div style="display:flex;align-items:center;justify-content:space-between;padding:var(--space-3) 0"><div><div style="font-size:var(--text-base);color:var(--text-primary);font-weight:600">Two-factor authentication</div><div style="font-size:var(--text-xs);color:var(--text-secondary);margin-top:2px">Require a code at sign-in</div></div><x-import component-from-global-scope="DyvoidedDesignSystem_7b704c.Switch" checked="{{ twoFactor }}" onChange="{{ setTwoFactor }}" hint-size="30px,17px"></x-import></div>
</div>
<div style="display:flex;flex-direction:column;gap:var(--space-2);margin-top:var(--space-4);padding-top:var(--space-4);border-top:1px solid var(--border-subtle)">
<x-import component-from-global-scope="DyvoidedDesignSystem_7b704c.Checkbox" checked="{{ productUpdates }}" onChange="{{ setProductUpdates }}" label="Product updates" hint-size="200px,20px"></x-import>
<x-import component-from-global-scope="DyvoidedDesignSystem_7b704c.Checkbox" checked="{{ teamActivity }}" onChange="{{ setTeamActivity }}" label="Team activity" hint-size="200px,20px"></x-import>
<x-import component-from-global-scope="DyvoidedDesignSystem_7b704c.Checkbox" checked="{{ marketingEmails }}" onChange="{{ setMarketingEmails }}" label="Marketing emails" hint-size="200px,20px"></x-import>
</div>
</x-import>
</div>
<x-import component-from-global-scope="DyvoidedDesignSystem_7b704c.Panel" title="Danger zone" hint-size="100%,100px">
<div style="display:flex;align-items:center;justify-content:space-between">
<div><div style="font-size:var(--text-base);color:var(--text-primary);font-weight:600">Delete account</div><div style="font-size:var(--text-xs);color:var(--text-tertiary);margin-top:2px">This cannot be undone.</div></div>
<x-import component-from-global-scope="DyvoidedDesignSystem_7b704c.Button" variant="danger" hint-size="140px,36px">Delete account</x-import>
</div>
</x-import>
</div>
</x-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { activeNav: 'profile', infoTab: 'general', fullName: 'Alex Novak', email: 'alex@dyvoided2.app', emailNotif: true, twoFactor: false, productUpdates: true, teamActivity: true, marketingEmails: false };
  renderVals() {
    return {
      activeNav: this.state.activeNav, setActiveNav: (id) => this.setState({ activeNav: id }),
      sidebarSections: [{ label: 'Account', items: [
        { id: 'profile', label: 'Profile' }, { id: 'notifications', label: 'Notifications' },
        { id: 'billing', label: 'Billing' }, { id: 'security', label: 'Security' },
      ] }],
      infoTab: this.state.infoTab, setInfoTab: (id) => this.setState({ infoTab: id }),
      infoTabs: [{ id: 'general', label: 'General' }, { id: 'advanced', label: 'Advanced' }],
      fullName: this.state.fullName, setFullName: (v) => this.setState({ fullName: v }),
      email: this.state.email, setEmail: (v) => this.setState({ email: v }),
      emailNotif: this.state.emailNotif, setEmailNotif: (v) => this.setState({ emailNotif: v }),
      twoFactor: this.state.twoFactor, setTwoFactor: (v) => this.setState({ twoFactor: v }),
      productUpdates: this.state.productUpdates, setProductUpdates: (v) => this.setState({ productUpdates: v }),
      teamActivity: this.state.teamActivity, setTeamActivity: (v) => this.setState({ teamActivity: v }),
      marketingEmails: this.state.marketingEmails, setMarketingEmails: (v) => this.setState({ marketingEmails: v }),
    };
  }
}
</script>
</body>
</html>
