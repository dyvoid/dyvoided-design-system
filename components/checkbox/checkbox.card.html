<html><head>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="../../styles.css">
<style>body{margin:0;background:var(--surface-app);padding:24px;font-family:var(--font-body);display:flex;gap:24px;align-items:center}</style></head>
<body data-theme="dark">
<label class="ds-check"><input type="checkbox" data-ds-peer checked><span class="ds-checkbox on" data-ds-peer-target><span class="ds-checkbox-inner"></span></span><span class="ds-check-label">Checked</span></label>
<label class="ds-check"><input type="checkbox" data-ds-peer><span class="ds-checkbox" data-ds-peer-target></span><span class="ds-check-label">Unchecked</span></label>
<label class="ds-check"><input type="checkbox" data-ds-peer aria-checked="mixed"><span class="ds-checkbox on" data-ds-peer-target><span class="ds-checkbox-inner mixed"></span></span><span class="ds-check-label">Indeterminate</span></label>
<label class="ds-check disabled"><input type="checkbox" data-ds-peer checked disabled><span class="ds-checkbox on off-disabled" data-ds-peer-target><span class="ds-checkbox-inner"></span></span><span class="ds-check-label disabled">Disabled</span></label>
</body></html>
