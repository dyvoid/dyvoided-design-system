<!-- @dsCard group="Components" viewport="700x220" name="Select" subtitle="Closed field and open popover" -->
<html><head>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/lucide@0.462.0/dist/umd/lucide.js"></script>
<script>window.addEventListener('DOMContentLoaded',()=>lucide.createIcons({color:'var(--text-tertiary)',strokeWidth:1.75}));</script>
<style>body{margin:0;background:var(--surface-app);padding:24px;font-family:var(--font-body);display:flex;gap:32px;align-items:flex-start}.col{width:220px;display:flex;flex-direction:column;gap:6px}.lbl{font-size:var(--text-sm);color:var(--text-secondary);font-weight:500}</style></head>
<body data-theme="dark">
<div class="col"><span class="lbl" id="lbl-device">Output device</span>
<button class="ds-select-field" aria-haspopup="listbox" aria-labelledby="lbl-device"><span>Built-in output</span><i data-lucide="chevron-down" class="ds-select-chev"></i></button></div>
<div class="col"><span class="lbl" id="lbl-rate">Sample rate</span>
<button class="ds-select-field open" aria-haspopup="listbox" aria-labelledby="lbl-rate" aria-expanded="true"><span>48 kHz</span><i data-lucide="chevron-up" class="ds-select-chev"></i></button>
<div class="ds-select-pop" role="listbox" aria-labelledby="lbl-rate"><button class="ds-select-option" role="option">44.1 kHz</button><button class="ds-select-option sel" role="option" aria-selected="true"><span>48 kHz</span><span class="ds-select-hint">default</span></button><button class="ds-select-option" role="option">96 kHz</button></div></div>
<script src="../../scripts/ds-eval-apply.js"></script></body></html>
