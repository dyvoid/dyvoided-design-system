<!-- @dsCard group="Components" viewport="700x320" name="Toast" subtitle="Four tones, neutral surface" -->
<html><head>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/lucide@0.462.0/dist/umd/lucide.js"></script>
<script>window.addEventListener('DOMContentLoaded',()=>lucide.createIcons({color:'var(--text-tertiary)',strokeWidth:1.75}));</script>
<style>body{margin:0;background:var(--surface-app);padding:24px;font-family:var(--font-body);display:flex;flex-direction:column;gap:10px;align-items:flex-start}</style></head>
<body data-theme="dark">
<div class="ds-toast" style="width:340px"><span class="ds-toast-dot success"></span><div class="ds-toast-body"><span class="ds-toast-title">Render complete</span><span class="ds-toast-msg">Bounced 2 stems to /exports.</span></div><i data-lucide="x" class="ds-toast-close"></i></div>
<div class="ds-toast" style="width:340px"><span class="ds-toast-dot info"></span><div class="ds-toast-body"><span class="ds-toast-title">Auto-save on</span></div></div>
<div class="ds-toast" style="width:340px"><span class="ds-toast-dot warning"></span><div class="ds-toast-body"><span class="ds-toast-title">Buffer underrun</span><span class="ds-toast-msg">Raised buffer to 512 samples.</span></div></div>
<div class="ds-toast" style="width:340px"><span class="ds-toast-dot danger"></span><div class="ds-toast-body"><span class="ds-toast-title">Export failed</span><span class="ds-toast-msg">Disk is full.</span></div></div>
<script src="../../scripts/ds-eval-apply.js"></script></body></html>
