<!-- @dsCard group="Colors" viewport="700x240" subtitle="Four seed-driven identity colors — not fixed" name="Accent" -->
<html><head><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;background:var(--surface-app);font-family:var(--font-body);display:flex}
.col{flex:1;display:flex;flex-direction:column}
.sw{flex:1;display:flex;align-items:flex-end;padding:8px 10px;font:11px var(--font-mono);color:#fff}
.note{padding:8px 10px;font:10px var(--font-mono);color:var(--text-tertiary);text-transform:uppercase;letter-spacing:.1em}
</style></head>
<body data-theme="dark">
<div class="col">
<div class="sw" style="background:var(--primary-700)">primary 700</div>
<div class="sw" style="background:var(--primary-600)">primary 600</div>
<div class="sw" style="background:var(--primary-500)">primary 500 · seed</div>
<div class="sw" style="background:var(--primary-400)">primary 400</div>
<div class="sw" style="background:var(--primary-300);color:#111">primary 300</div>
</div>
<div class="col">
<div class="sw" style="background:var(--accent-1-600)">accent-1 600</div>
<div class="sw" style="background:var(--accent-1-500)">accent-1 500 · seed</div>
<div class="sw" style="background:var(--accent-1-400);color:#111">accent-1 400</div>
<div class="sw" style="background:var(--accent-2-500)">accent-2 500 · seed</div>
<div class="sw" style="background:var(--accent-3-500)">accent-3 500 · seed</div>
</div>
<div class="col">
<div class="note">Fixed — not themeable</div>
<div class="sw" style="background:var(--signature-500)">signature</div>
<div class="sw" style="background:var(--success-500)">success</div>
<div class="sw" style="background:var(--warning-500);color:#111">warning</div>
<div class="sw" style="background:var(--danger-500)">danger</div>
</div>
</body></html>
