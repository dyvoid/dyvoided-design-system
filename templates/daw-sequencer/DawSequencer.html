<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dyvoided.2 — DAW Sequencer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/lucide@0.462.0/dist/umd/lucide.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--surface-sunken); font-family: var(--font-body); }
  .shell { width: 1280px; height: 800px; margin: 0 auto; display: flex; flex-direction: column; overflow: hidden; background: var(--surface-app); }

  /* Transport bar */
  .transport { height: 56px; flex-shrink: 0; display: flex; align-items: center; gap: var(--space-6); padding: 0 var(--space-6); border-bottom: var(--border-width) solid var(--border-subtle); background: var(--surface-panel); }
  .transport-readout { display: flex; align-items: stretch; gap: 1px; background: var(--surface-sunken); border: var(--border-width) solid var(--border-strong); border-radius: var(--radius-sm); overflow: hidden; }
  .readout-cell { padding: 6px 12px; display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 60px; }
  .readout-cap { font-family: var(--font-mono); font-size: var(--font-size-2xs); letter-spacing: .12em; text-transform: uppercase; color: var(--text-tertiary); }
  .readout-val { font-family: var(--font-mono); font-size: var(--text-md); font-weight: 500; font-feature-settings: 'tnum'; }
  .transport-right { margin-left: auto; display: flex; align-items: center; gap: var(--space-5); }

  /* Body */
  .body { flex: 1; display: flex; min-height: 0; }

  /* Track list (left) */
  .track-list { width: 230px; flex-shrink: 0; border-right: var(--border-width) solid var(--border-subtle); background: var(--surface-panel); display: flex; flex-direction: column; min-height: 0; }
  .track-list-head { padding: var(--space-5) var(--space-5) var(--space-3); display: flex; justify-content: space-between; }
  .track-list-body { flex: 1; overflow: auto; padding: 0 var(--space-3) var(--space-4); display: flex; flex-direction: column; gap: 2px; }
  .track-item { display: flex; align-items: center; gap: 10px; padding: var(--space-3); border-radius: var(--radius-sm); cursor: pointer; }
  .track-item:hover { background: var(--surface-hover); }
  .track-item.sel { background: var(--primary-muted-bg); }
  .track-dot { width: 8px; height: 8px; border-radius: var(--radius-xs); flex-shrink: 0; }
  .track-name { font-size: var(--text-sm); color: var(--text-primary); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .track-meta { font-family: var(--font-mono); font-size:var(--font-size-2xs); color: var(--text-tertiary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* Timeline (center) */
  .timeline { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .ruler { height: 32px; flex-shrink: 0; display: flex; border-bottom: var(--border-width) solid var(--border-subtle); background: var(--surface-panel); }
  .ruler-spacer { width: 120px; flex-shrink: 0; border-right: var(--border-width) solid var(--border-subtle); }
  .ruler-bar { flex: 1; position: relative; }
  .ruler-tick { position: absolute; top: 0; bottom: 0; display: flex; align-items: center; padding-left: 6px; font-family: var(--font-mono); font-size:var(--font-size-2xs); color: var(--text-tertiary); }
  .ruler-tick::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 1px; background: var(--border-subtle); }
  .lanes { flex: 1; overflow: auto; }
  .lane { height: 56px; display: flex; border-bottom: var(--border-width) solid var(--border-subtle); position: relative; }
  .lane.sel { background: var(--primary-muted-bg); }
  .lane-head { width: 120px; flex-shrink: 0; border-right: var(--border-width) solid var(--border-subtle); background: var(--surface-panel); display: flex; align-items: center; gap: 8px; padding: 0 var(--space-4); }
  .lane-head-name { font-size: var(--text-xs); color: var(--text-secondary); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lane-body { flex: 1; position: relative; }
  .clip { position: absolute; top: 8px; bottom: 8px; border-radius: var(--radius-xs); box-shadow: var(--shadow-sm); }
  .lane-empty { position: absolute; left: var(--space-4); top: 50%; transform: translateY(-50%); font-family: var(--font-mono); font-size: var(--font-size-2xs); letter-spacing: var(--tracking-wide); text-transform: uppercase; color: var(--text-tertiary); opacity: .7; }

  /* Inspector (right) */
  .inspector { width: 260px; flex-shrink: 0; border-left: var(--border-width) solid var(--border-subtle); background: var(--surface-panel); overflow: auto; }
  .insp-section { padding: var(--space-5); border-bottom: var(--border-width) solid var(--border-subtle); }
  .insp-row { display: flex; justify-content: space-between; padding: var(--space-2) 0; font-size: var(--text-sm); }
  .insp-row + .insp-row { border-top: var(--border-width) solid var(--border-subtle); }
  .insp-row-label { color: var(--text-secondary); }
  .insp-row-val { font-family: var(--font-mono); color: var(--text-primary); }
  .insp-empty { padding: var(--space-4) 0; font-size: var(--text-sm); color: var(--text-tertiary); line-height: var(--leading-body); text-wrap: pretty; }
  .insp-params { display: flex; flex-direction: column; gap: var(--space-5); }
  .meters { display: flex; gap: 6px; align-items: flex-end; height: 70px; }
  .meter { flex: 1; background: var(--surface-sunken); border: var(--border-width) solid var(--border-subtle); border-radius: var(--radius-xs); position: relative; overflow: hidden; display: flex; flex-direction: column-reverse; }
  .meter-fill { width: 100%; background: linear-gradient(0deg, var(--success-500), var(--warning-500) 78%, var(--danger-500)); }
  .ds-slider-fill.a2 { background: var(--accent-2-500); }
  .ds-slider-knob.a2 { border-color: var(--accent-2-500); }
</style>
</head>
<body data-theme="dark">

<div class="shell">
  <div class="ds-win-bar">
    <div class="ds-win-dots"><span class="ds-win-dot" style="background:var(--danger-500)"></span><span class="ds-win-dot" style="background:var(--accent-1-500)"></span><span class="ds-win-dot" style="background:var(--success-500)"></span></div>
    <span class="ds-win-title">Cadence</span>
  </div>

  <!-- Transport bar -->
  <div class="transport">
    <div style="display:flex;align-items:center;gap:6px">
      <button class="ds-btn ds-btn-ghost ds-btn-sm" style="width:36px" aria-label="Skip to start"><i data-lucide="skip-back"></i></button>
      <button class="ds-btn ds-btn-ghost ds-btn-sm" style="width:36px" aria-label="Stop"><i data-lucide="square"></i></button>
      <button class="ds-btn ds-btn-primary ds-btn-sm" style="width:36px" id="play-btn" aria-label="Play"><i data-lucide="play"></i></button>
      <button class="ds-btn ds-btn-danger ds-btn-sm" style="width:36px" id="rec-btn" aria-label="Record"><i data-lucide="circle"></i></button>
    </div>
    <div class="transport-readout">
      <div class="readout-cell"><span class="readout-cap">Bar · Beat</span><span class="readout-val" style="color:var(--primary)">009 · 3</span></div>
      <div class="readout-cell"><span class="readout-cap">Tempo</span><span class="readout-val" style="color:var(--text-primary)">124.0</span></div>
      <div class="readout-cell"><span class="readout-cap">Sig</span><span class="readout-val" style="color:var(--text-primary)">4/4</span></div>
    </div>
    <div class="transport-right">
      <span class="ds-badge ds-badge-neutral">48 kHz · 24-bit</span>
      <span class="ds-badge ds-badge-accent">Metronome on</span>
    </div>
  </div>

  <div class="body">
    <!-- Track list -->
    <div class="track-list">
      <div class="track-list-head">
        <span class="ds-group-label">Tracks</span>
        <span style="font-family:var(--font-mono);font-size:var(--font-size-2xs);color:var(--text-secondary)">12</span>
      </div>
      <div class="track-list-body" id="track-list"></div>
    </div>

    <!-- Timeline -->
    <div class="timeline">
      <div class="ruler">
        <div class="ruler-spacer"></div>
        <div class="ruler-bar" id="ruler-bar"></div>
      </div>
      <div class="lanes" id="lanes"></div>
    </div>

    <!-- Inspector -->
    <div class="inspector">
      <div class="insp-section">
        <div class="ds-group-label" style="margin-bottom:var(--space-4);white-space:nowrap;overflow:hidden;text-overflow:ellipsis" id="insp-clip-title">Clip — Vox chop (comp 3, take 7 — keeper)</div>
        <div class="insp-row"><span class="insp-row-label">Length</span><span class="insp-row-val">2 clips · 16 bars</span></div>
        <div class="insp-row"><span class="insp-row-label">Quantize</span><span class="insp-row-val">1/16</span></div>
      </div>
      <div class="insp-section">
        <div class="ds-group-label" style="margin-bottom:var(--space-4)">Track params</div>
        <div class="insp-params">
          <div class="ds-slider-field">
            <div class="ds-slider-head"><span class="ds-slider-label">Volume</span><span class="ds-slider-value" id="vol-val">-5.6 dB</span></div>
            <div class="ds-slider-track" data-ds-track><div class="ds-slider-fill" style="width:72%"></div><div class="ds-slider-knob" style="left:calc(72% - 7px)"></div><input type="range" min="0" max="100" value="72" id="vol"></div>
          </div>
          <div class="ds-slider-field">
            <div class="ds-slider-head"><span class="ds-slider-label">Pan</span><span class="ds-slider-value" id="pan-val">L 12</span></div>
            <div class="ds-slider-track" data-ds-track><div class="ds-slider-fill a2" style="width:38%"></div><div class="ds-slider-knob a2" style="left:calc(38% - 7px)"></div><input type="range" min="0" max="100" value="38" id="pan"></div>
          </div>
          <div class="ds-slider-field">
            <div class="ds-slider-head"><span class="ds-slider-label">Send — Reverb</span><span class="ds-slider-value" id="rev-val">28%</span></div>
            <div class="ds-slider-track" data-ds-track><div class="ds-slider-fill a2" style="width:28%"></div><div class="ds-slider-knob a2" style="left:calc(28% - 7px)"></div><input type="range" min="0" max="100" value="28" id="rev"></div>
          </div>
        </div>
      </div>
      <div class="insp-section">
        <div class="ds-group-label" style="margin-bottom:var(--space-2)">Output</div>
        <div class="meters">
          <div class="meter"><div class="meter-fill" style="height:62%"></div></div>
          <div class="meter"><div class="meter-fill" style="height:71%"></div></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
// Semantic color rule: a track's dot/clip color encodes its TYPE, not its position.
// audio -> accent-1, midi -> accent-2, bus -> accent-3, frozen -> neutral gray.
const TYPE_COLOR = {
  audio: { dot: 'var(--accent-1-500)', fill: 'linear-gradient(180deg,var(--accent-1-400),var(--accent-1-600))' },
  midi:  { dot: 'var(--accent-2-500)', fill: 'linear-gradient(180deg,var(--accent-2-400),var(--accent-2-600))' },
  bus:   { dot: 'var(--accent-3-500)', fill: 'linear-gradient(180deg,var(--accent-3-400),var(--accent-3-600))' },
};
const NEUTRAL = { dot: 'var(--gray-500)', fill: 'linear-gradient(180deg,var(--gray-500),var(--gray-600))' };
const colorFor = (type) => TYPE_COLOR[type] || NEUTRAL;

// 12 tracks in the project, 9 in view
const TRACKS = [
  { name: 'Kick — 909', type: 'audio', meta: 'Audio · 4 clips', clips: [[2, 22]] },
  { name: 'Snare — layered top + tail', type: 'audio', meta: 'Audio · 6 clips', clips: [[2, 12], [18, 30]] },
  { name: 'Bass — Reese', type: 'midi', meta: 'MIDI · Serum', clips: [[2, 46]] },
  { name: 'Lead — Bright Pluck', type: 'midi', meta: 'MIDI · 32 notes', clips: [[26, 48]] },
  { name: 'Pad — Intro', type: 'frozen', meta: 'Audio · frozen', clips: [[2, 24]] },
  { name: 'Vox chop (comp 3, take 7 — keeper)', type: 'audio', meta: 'Audio · 2 clips', clips: [[8, 16], [40, 20]] },
  { name: 'FX — Riser', type: 'audio', meta: 'Audio · 1 clip', clips: [[54, 9]] },
  { name: 'Room mics', type: 'audio', meta: 'Audio · no clips', clips: [] },
  { name: 'Drum bus', type: 'bus', meta: 'Bus · 3 sends', clips: [[2, 72]] },
];
const TOTAL_TRACKS = 12;
let selectedTrack = 5;

// Ruler ticks at odd bars (1,3,5,...15) across 16-bar span
const rulerBar = document.getElementById('ruler-bar');
[1, 3, 5, 7, 9, 11, 13, 15].forEach(bar => {
  const tick = document.createElement('div');
  tick.className = 'ruler-tick';
  tick.style.left = ((bar - 1) / 16 * 100) + '%';
  tick.textContent = bar;
  rulerBar.appendChild(tick);
});

// Track list
const trackList = document.getElementById('track-list');
TRACKS.forEach((t, i) => {
  const c = colorFor(t.type);
  const el = document.createElement('div');
  el.className = 'track-item' + (i === selectedTrack ? ' sel' : '');
  el.dataset.idx = i;
  el.innerHTML = `<span class="track-dot" style="background:${c.dot}"></span><div style="flex:1;min-width:0"><div class="track-name">${t.name}</div><div class="track-meta">${t.meta}</div></div>`;
  el.addEventListener('click', () => selectTrack(i));
  trackList.appendChild(el);
});

// Lanes with clips
const lanes = document.getElementById('lanes');
TRACKS.forEach((t, i) => {
  const c = colorFor(t.type);
  const lane = document.createElement('div');
  lane.className = 'lane' + (i === selectedTrack ? ' sel' : '');
  let clipsHtml = '';
  if (t.clips.length) {
    clipsHtml = t.clips.map(([left, width]) =>
      `<div class="clip" style="left:${left}%;width:${width}%;background:${c.fill}"></div>`
    ).join('');
  } else {
    clipsHtml = '<span class="lane-empty">No clips — drop audio or record</span>';
  }
  lane.innerHTML = `<div class="lane-head"><span class="track-dot" style="background:${c.dot}"></span><span class="lane-head-name">${t.name}</span></div><div class="lane-body">${clipsHtml}</div>`;
  lane.addEventListener('click', (e) => { if (e.target.closest('.lane-head') || e.target.classList.contains('lane-body')) selectTrack(i); });
  lanes.appendChild(lane);
});

function selectTrack(i) {
  selectedTrack = i;
  document.querySelectorAll('.track-item').forEach((el, idx) => el.classList.toggle('sel', idx === i));
  document.querySelectorAll('.lane').forEach((el, idx) => el.classList.toggle('sel', idx === i));
  const t = TRACKS[i];
  document.getElementById('insp-clip-title').textContent = 'Clip — ' + t.name;
}

// Transport
let playing = false, recording = true;
document.getElementById('play-btn').addEventListener('click', () => {
  playing = !playing;
  const btn = document.getElementById('play-btn');
  btn.querySelector('i').setAttribute('data-lucide', playing ? 'pause' : 'play');
  btn.setAttribute('aria-label', playing ? 'Pause' : 'Play');
  lucide.createIcons();
});
document.getElementById('rec-btn').addEventListener('click', () => {
  recording = !recording;
  const btn = document.getElementById('rec-btn');
  btn.className = 'ds-btn ' + (recording ? 'ds-btn-danger' : 'ds-btn-ghost') + ' ds-btn-sm';
  btn.style.width = '36px';
});

lucide.createIcons({ color: 'var(--text-tertiary)', strokeWidth: 1.75 });

// Sliders
function bindSlider(id, valId, fmt) {
  const input = document.getElementById(id);
  const track = input.closest('.ds-slider-track');
  const fill = track.querySelector('.ds-slider-fill');
  const knob = track.querySelector('.ds-slider-knob');
  const val = document.getElementById(valId);
  input.addEventListener('input', () => {
    const v = +input.value;
    fill.style.width = v + '%';
    knob.style.left = `calc(${v}% - 7px)`;
    val.textContent = fmt(v);
  });
}
bindSlider('vol', 'vol-val', v => ((v - 100) * 0.2).toFixed(1) + ' dB');
bindSlider('pan', 'pan-val', v => v < 50 ? 'L ' + (50 - v) : v > 50 ? 'R ' + (v - 50) : 'C');
bindSlider('rev', 'rev-val', v => v + '%');
</script>
</body>
</html>
